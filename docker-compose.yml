version: '3.8'

services:
  # 1. 缓存层 (Redis)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - cinevault-net

  # 1.1 消息队列基础设施
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - cinevault-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - cinevault-net

  # 2. 数据库层 (本地 MySQL)
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: movie_db
      MYSQL_ROOT_PASSWORD: CineVault2024!
    ports:
      - "3307:3306"
    networks:
      - cinevault-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCineVault2024!" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. 后端 API (Spring Boot)
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/movie_db?allowPublicKeyRetrieval=true&useSSL=false
      - DB_USERNAME=root
      - DB_PASSWORD=CineVault2024!
      - REDIS_HOST=redis
      - JWT_SECRET=cinevault_distributed_system_super_secure_secret_key_2024_05_05
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    restart: on-failure
    networks:
      - cinevault-net

  # 4. 推荐引擎 (FastAPI)
  recommender:
    build: ./recommendation
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=CineVault2024!
      - DB_NAME=movie_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cinevault-net

  # 5. 前端 (React + Nginx)
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cinevault-net

  # 6. 可观测性 (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cinevault-net

  # 7. 可观测性仪表盘 (Grafana)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - cinevault-net

  # 8. 分布式链路追踪 (Zipkin)
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    networks:
      - cinevault-net

networks:
  cinevault-net:
    driver: bridge
